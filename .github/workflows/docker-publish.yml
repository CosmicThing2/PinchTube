# Builds the Docker image and publishes it to the GitHub Container Registry as
# ghcr.io/cosmicthing2/pinchtube whenever a release tag such as v2026.10.27 is
# pushed (publishing a release on GitHub creates that tag). The tag is also the
# version the app shows, so a release needs no code change first. It can be run
# by hand from the Actions tab to rebuild a release: pick the release's tag
# under "Use workflow from".
name: Publish Docker image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/cosmicthing2/pinchtube

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # v2026.10.27 -> 2026.10.27, for the image tag and the app's version.
      - name: Read the version from the tag
        id: version
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::This builds releases. Run it again and pick a release tag (such as v2026.10.27) under 'Use workflow from' instead of a branch."
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v2026.10.27 becomes the image tags "2026.10.27" and "latest".
      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
